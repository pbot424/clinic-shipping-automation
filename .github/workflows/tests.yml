name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Isolated application and demo tests
        run: python -m unittest discover -s tests -v
      - name: Mocked startup checks
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test-fedex-startup.ps1
